conductor.additional.modules=com.netflix.conductor.contribs.AMQPModule,com.netflix.conductor.contribs.metrics.MetricsRegistryModule,com.netflix.conductor.contribs.metrics.LoggingMetricsModule,com.netflix.conductor.contribs.ArchivingWorkflowModule
conductor.app.asyncIndexingEnabled=false
conductor.app.eventExecutionIndexingEnabled=false
conductor.app.eventMessageIndexingEnabled=false
conductor.app.eventProcessorThreadCount=150
conductor.app.stack=active
conductor.app.sweeperThreadCount=200
conductor.app.systemTaskMaxPollCount=300
conductor.app.systemTaskWorkerCallbackDuration=1s
conductor.app.systemTaskWorkerThreadCount=300
conductor.app.taskExecLogIndexingEnabled=false
conductor.app.workflowExecutionLockEnabled=true

conductor.db.type=redis_standalone

#conductor.elasticsearch.version=6
#conductor.elasticsearch.asyncMaxPoolSize=30
#conductor.elasticsearch.asyncWorkerQueueSize=5000
#conductor.elasticsearch.indexBatchSize=300
#conductor.elasticsearch.indexPrefix=conductor_active
#conductor.elasticsearch.url=http://localhost:9200

conductor.event-queues.amqp.enabled=true
conductor.event-queues.amqp.durable=true
conductor.event-queues.amqp.exclusive=false
conductor.event-queues.amqp.hosts=localhost
conductor.event-queues.amqp.port.port=5672

conductor.grpc-server.enabled=false
conductor.indexing.enabled=false
conductor.metrics-logger.enabled=true
conductor.metrics-prometheus.enabled=true

conductor.redis-lock.serverAddress=redis://localhost:6379
conductor.redis-lock.serverType=single
conductor.redis.clusterName=dyno1
conductor.redis.hosts=localhost:6379:us-east-1c
conductor.redis.maxConnectionsPerHost=300
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.queuesNonQuorumPort=22122

# For a single node dynomite or redis server, make sure the value below is set to same as rack specified in the "workflow.dynomite.cluster.hosts" property.
conductor.redis.availabilityZone=us-east-1c
#conductor.redis.maxIdleConnections=8
#conductor.redis.minIdleConnections=5
#conductor.redis.minEvictableIdleTimeMillis = 1800000
#conductor.redis.timeBetweenEvictionRunsMillis = -1L
#conductor.redis.testWhileIdle = false
#conductor.redis.numTestsPerEvictionRun = 3

#Name of the elasticsearch cluster
conductor.elasticsearch.indexName=conductor

#Elasticsearch major release version.
#conductor.elasticsearch.version=7

spring.application.name=conductor
springdoc.api-docs.path=/api-docs
conductor.elasticsearch.clusterHealthColor=yellow
conductor.queue.type=redis_standalone
management.metrics.export.datadog.apiKey=weew
management.endpoints.web.exposure.include=prometheus,health
management.metrics.web.server.request.autotime.percentiles=0.50,0.75,0.90,0.95,0.99
